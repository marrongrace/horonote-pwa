<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HoroNote</title>
    
    <!-- PWA用マニフェストとアイコンの設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/marrongrace/Horonote-Earth/main/Horo_logo.png">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        .app-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: #000000;
        }
        iframe {
            width: 100%;
            max-width: 480px; /* タブレットやPCではスマホ幅（480px）に制限して中央に表示 */
            height: 100%;
            border: none;
            display: block;
            background-color: #000000;
        }
    </style>
</head>
<body>
    <!-- 中央寄せ用のコンテナで包む -->
    <div class="app-container">
        <iframe src="https://horonote-earth.streamlit.app/?embed=true"></iframe>
    </div>
</body>
</html>
